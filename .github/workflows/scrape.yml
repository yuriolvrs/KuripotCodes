name: Scrape promos

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated promos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/promos.json; then
            echo "No changes to promos.json"
            exit 0
          fi

          # lastSeen is bumped on every promo re-found each run, which would
          # otherwise cause a commit every run even with no new/removed codes.
          # Ignore lastSeen-only diffs and skip committing when nothing else changed.
          before=$(git show HEAD:data/promos.json | jq 'map(del(.lastSeen)) | sort_by(.id)')
          after=$(jq 'map(del(.lastSeen)) | sort_by(.id)' data/promos.json)

          if [ "$before" = "$after" ]; then
            echo "Only lastSeen timestamps changed; skipping commit"
            exit 0
          fi

          git add data/promos.json
          git commit -m "Update scraped promos"
          git push
