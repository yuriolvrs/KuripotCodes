name: Scrape promos

on:
  schedule:
    - cron: "5 0 * * *"      # 12:05 AM
    - cron: "30 5 * * *"     # 5:30 AM
    - cron: "45 10 * * *"    # 10:45 AM
    - cron: "30 15 * * *"    # 3:30 PM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Run scraper
        run: xvfb-run -a npm run scrape

      - name: Commit updated promos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promos.json
          git diff --cached --quiet || git commit -m "Update scraped promos"
          git push
